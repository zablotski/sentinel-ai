name: "Sentinel AI Audit"

on:
  pull_request:
    branches: [ main, master ]
    # Only schedule the audit when a dependency manifest or policy file changes.
    paths:
      - 'package.json'
      - 'package-lock.json'
      - '.sentinel.yml'
      - 'sentinel.models.yml'

jobs:
  audit:
    runs-on: ubuntu-latest
    services:
      qdrant:
        image: qdrant/qdrant:latest
        ports:
          - 6333:6333

    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Sentinel AI Audit
        run: |
          python -m app.cli --package-json package.json
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          QDRANT_URL: "http://localhost:6333"
